            done
            if [ "$ran" = "0" ]; then
              echo "pm-shim: no lifecycle scripts in $pkgdir — nothing to rebuild" >&2
            fi
            return 0
          }

          if [ "${1:-}" = "-C" ] && [ $# -ge 4 ] && [ "${3:-}" = "run" ]; then
            dir="$2"
            script="$4"
            shift 4
            case "$dir" in
              /*) abs="$dir" ;;
              *)  abs="$PWD/$dir" ;;
            esac
            # NOT `bun --cwd <abs> run <script>`: silent no-op on Bun 1.4.4 (proven).
            cd "$abs"
            exec "$BUN" run "$script" "$@"
          fi

          if [ "${1:-}" = "--filter" ] && [ $# -ge 4 ] && [ "${3:-}" = "rebuild" ]; then
            ws_name="$2"
            shift 3
            ws_dir=""
            for d in apps/* packages/* tools/*; do
              [ -f "$d/package.json" ] || continue
              if [ "$(pkg_name "$PWD/$d/package.json")" = "$ws_name" ]; then
                ws_dir="$PWD/$d"
                break
              fi
            done
            [ -n "$ws_dir" ] || { echo "pm-shim: workspace not found: $ws_name" >&2; exit 2; }
            for pkg in "$@"; do
              link="$ws_dir/node_modules/$pkg"
              [ -e "$link" ] || { echo "pm-shim: $pkg not installed under $ws_name" >&2; exit 2; }
              run_install_script "$(readlink -f "$link")"
            done
            exit 0
          fi

          echo "pm-shim: unsupported invocation: $*" >&2
          exit 2
          ODBUN_PM_SHIM_EOF
          chmod +x "$RUNNER_TEMP/pm-shim"

      - name: Filtered install (frozen lockfile)
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          bun install --ignore-scripts --frozen-lockfile \
            --filter open-design --filter @open-design/web --filter @open-design/release \
            --filter @open-design/contracts --filter @open-design/components \
            --filter @open-design/platform --filter @open-design/host \
            --filter @open-design/registry-protocol --filter @open-design/agui-adapter \
            --filter @open-design/plugin-runtime --filter @open-design/sidecar-proto \
            --filter @open-design/launcher-proto --filter @open-design/sidecar \
            --filter @open-design/diagnostics --filter @open-design/daemon

      - name: Closure build (postinstall + pm-shim)
        env:
          OPEN_DESIGN_POSTINSTALL_CONCURRENCY: "2"
          OPEN_DESIGN_POSTINSTALL_TARGETS: '["apps/daemon","packages/host","packages/components"]'
        run: |
          npm_execpath="$RUNNER_TEMP/pm-shim" bun scripts/postinstall.mjs build
          test -f apps/daemon/dist/cli.js

      # --bun is load-bearing: plain `bunx vitest` honours the vitest
      # bin's `#!/usr/bin/env node` shebang and silently delegates to
      # any node on PATH (proven locally by process inspection,
      # port/TEST-SUITES.md §2) — the job would secretly be a second
      # Node track. --bun forces the Bun runtime.
      - name: Daemon Vitest suite on the Bun runtime
        working-directory: apps/daemon
        run: bunx --bun vitest run -c vitest.config.ts

      # always(): same lesson as the Node track above — a daemon-suite
      # failure must not skip the web suite; its numbers are
      # independent signal. This step is the FIRST measurement of the
      # web suite on the Bun runtime (until now this job ran the
      # daemon suite only); the Node track's web numbers in
      # port/TEST-SUITES.md are the comparison baseline. --maxWorkers=2
      # mirrors the Node web step verbatim.
      - name: Web Vitest suite on the Bun runtime
        if: always()
        working-directory: apps/web
        run: bunx --bun vitest run -c vitest.config.ts --maxWorkers=2
