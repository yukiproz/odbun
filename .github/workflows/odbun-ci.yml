# odbun CI — this port's own workflow (Bun only; no step installs
# Node — see the node note in the build jobs below).
#
# Jobs:
#   port-layer   — the port layer itself: adapter tests + spikes.
#   typecheck    — filtered frozen install + closure build, then
#                  `bun check` over the daemon project and the
#                  daemon-tests project (fast gate; emits nothing).
#   daemon-smoke — same install + build, then boot the daemon under
#                  Bun and require /api/health and /api/projects 200.
#   test-suites  — UPDATE BASELINE: the upstream Vitest suites
#                  (daemon + web) executed on the runner's
#                  PREINSTALLED Node (never installed by this
#                  workflow). Runs only for upstream-update work
#                  (pushes to update/** branches, PRs from them, or
#                  manual dispatch) — see the job comment.
#   test-suites-bun — THE GATE: the daemon and web suites on the
#                  Bun runtime. Fully green since CI run
#                  42194971430; a failure here fails the run. See
#                  the job comment and port/TEST-SUITES.md.
# Recipes and evidence: port/BUILD-PROBE.md, port/SMOKE-MAIN.md.
name: odbun-ci

on:
  push:
    branches: [main, 'update/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  port-layer:
    name: port layer (bun test + spikes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Guard — no Node in the port layer
        run: |
          if grep -rn '"node"' port/package.json; then
            echo "unexpected node reference in port/package.json" >&2
            exit 1
          fi
          bun --version

      - name: Adapter tests
        working-directory: port
        run: bun test

      # always(): spikes probe the Bun primitives directly, so their
      # result stays meaningful (and diagnostic) even if the adapter
      # tests above fail. A failed step still fails this job overall.
      - name: Spikes
        if: always()
        working-directory: port
        run: |
          bun run spikes/01-sqlite.ts
          bun run spikes/02-spawn.ts
          bun run spikes/03-serve.ts
          bun run spikes/04-terminal.ts

  # The install + closure-build step text below is repeated in both
  # build jobs on purpose: GitHub Actions does not support YAML
  # anchors, and a composite action would hide the recipe this port
  # proved in port/BUILD-PROBE.md §1/§3.
  #
  # Node note: this workflow never installs Node. ubuntu-latest
  # preinstalls a node binary, and upstream package build scripts
  # invoke `node ./esbuild.config.mjs` / `tsx` internally during the
  # closure build (BUILD-PROBE §3 — build-time only). The daemon is
  # built, type-checked and run by Bun alone.
  typecheck:
    name: typecheck (bun check — daemon + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Create pm-shim (pnpm dialect -> bun, for scripts/postinstall.mjs)
        run: |
          cat > "$RUNNER_TEMP/pm-shim" <<'ODBUN_PM_SHIM_EOF'
          #!/usr/bin/env bash
          # pm-shim (odbun CI variant) — translates the pnpm CLI dialect used by
          # scripts/postinstall.mjs into Bun. Created on the fly by the odbun-ci
          # workflow (and by the local dry run) into a temp dir; not committed.
          # package.json parsing uses `bun -e` (never a node binary), and there is
          # no node-gyp-bin PATH injection: node-gyp belongs to the Node native
          # toolchain this port deletes.
          #
          # Supported:
          #   pm-shim -C <dir> run <script> [args...]
          #       -> cd <abs dir> && bun run <script> [args...]        (phase "build")
          #   pm-shim --filter <workspace-name> rebuild <pkg> [pkg...]
          #       -> run each named dependency's own lifecycle scripts
          #          (preinstall -> install -> postinstall) in the workspace's
          #          node_modules (pnpm rebuild semantics; phase "dependencies")
          # Anything else exits 2 loudly instead of guessing.
          set -euo pipefail
          BUN="$(command -v bun)"

          pkg_name() { "$BUN" -e 'const fs = require("fs"); try { console.log(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).name || "") } catch { console.log("") }' "$1"; }
          pkg_script() { "$BUN" -e 'const fs = require("fs"); try { console.log(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).scripts?.[process.argv[2]] || "") } catch { console.log("") }' "$1" "$2"; }

          run_install_script() {
            local pkgdir="$1"
            local storebin bindir phase script ran=0
            storebin="$(dirname "$pkgdir")/.bin"
            bindir="$pkgdir/node_modules/.bin"
            for phase in preinstall install postinstall; do
              script="$(pkg_script "$pkgdir/package.json" "$phase")"
              [ -n "$script" ] || continue
              ran=1
              echo "pm-shim: running $phase script in $pkgdir: $script" >&2
              ( cd "$pkgdir" && PATH="$storebin:$bindir:$PATH" sh -c "$script" ) || return $?
            done
            if [ "$ran" = "0" ]; then
              echo "pm-shim: no lifecycle scripts in $pkgdir — nothing to rebuild" >&2
            fi
            return 0
          }

          if [ "${1:-}" = "-C" ] && [ $# -ge 4 ] && [ "${3:-}" = "run" ]; then
            dir="$2"
            script="$4"
            shift 4
            case "$dir" in
              /*) abs="$dir" ;;
              *)  abs="$PWD/$dir" ;;
            esac
            # NOT `bun --cwd <abs> run <script>`: silent no-op on Bun 1.4.4 (proven).
            cd "$abs"
            exec "$BUN" run "$script" "$@"
          fi

          if [ "${1:-}" = "--filter" ] && [ $# -ge 4 ] && [ "${3:-}" = "rebuild" ]; then
            ws_name="$2"
            shift 3
            ws_dir=""
            for d in apps/* packages/* tools/*; do
              [ -f "$d/package.json" ] || continue
              if [ "$(pkg_name "$PWD/$d/package.json")" = "$ws_name" ]; then
                ws_dir="$PWD/$d"
                break
              fi
            done
            [ -n "$ws_dir" ] || { echo "pm-shim: workspace not found: $ws_name" >&2; exit 2; }
            for pkg in "$@"; do
              link="$ws_dir/node_modules/$pkg"
              [ -e "$link" ] || { echo "pm-shim: $pkg not installed under $ws_name" >&2; exit 2; }
              run_install_script "$(readlink -f "$link")"
            done
            exit 0
          fi

          echo "pm-shim: unsupported invocation: $*" >&2
          exit 2
          ODBUN_PM_SHIM_EOF
          chmod +x "$RUNNER_TEMP/pm-shim"

      - name: Filtered install (frozen lockfile)
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          bun install --ignore-scripts --frozen-lockfile \
            --filter open-design --filter @open-design/web --filter @open-design/release \
            --filter @open-design/contracts --filter @open-design/components \
            --filter @open-design/platform --filter @open-design/host \
            --filter @open-design/registry-protocol --filter @open-design/agui-adapter \
            --filter @open-design/plugin-runtime --filter @open-design/sidecar-proto \
            --filter @open-design/launcher-proto --filter @open-design/sidecar \
            --filter @open-design/diagnostics --filter @open-design/daemon

      - name: Closure build (postinstall + pm-shim)
        env:
          OPEN_DESIGN_POSTINSTALL_CONCURRENCY: "2"
          OPEN_DESIGN_POSTINSTALL_TARGETS: '["apps/daemon","packages/host","packages/components"]'
        run: |
          npm_execpath="$RUNNER_TEMP/pm-shim" bun scripts/postinstall.mjs build
          test -f apps/daemon/dist/cli.js

      - name: Type gate — daemon project
        run: bun check -p apps/daemon/tsconfig.json

      # always(): the tests-project gate is independent of the
      # daemon-project gate above — report both even when the first
      # fails. A failed step still fails this job overall.
      - name: Type gate — daemon tests project
        if: always()
        run: bun check -p apps/daemon/tsconfig.tests.json

  daemon-smoke:
    name: daemon smoke (boot under Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Create pm-shim (pnpm dialect -> bun, for scripts/postinstall.mjs)
        run: |
          cat > "$RUNNER_TEMP/pm-shim" <<'ODBUN_PM_SHIM_EOF'
          #!/usr/bin/env bash
          # pm-shim (odbun CI variant) — translates the pnpm CLI dialect used by
          # scripts/postinstall.mjs into Bun. Created on the fly by the odbun-ci
          # workflow (and by the local dry run) into a temp dir; not committed.
          # package.json parsing uses `bun -e` (never a node binary), and there is
          # no node-gyp-bin PATH injection: node-gyp belongs to the Node native
          # toolchain this port deletes.
