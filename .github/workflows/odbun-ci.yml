  # UPDATE-BASELINE TEST SUITES (Hadi decision, 2026-11-06, after
  # CI run 42194971430 met the dual-track exit condition: the Bun
  # track below is fully green and is now THE GATE). This Node track
  # no longer gates anything; it survives as the upstream-triage
  # baseline. Upstream's devs write and test this code on Node, so
  # when an update/* branch merges upstream changes (PORTING.md's
  # update flow), running the same tree on Node is the clean way to
  # tell a port regression apart from an upstream change and from
  # Bun/Vitest interop noise. That is why the job below runs ONLY
  # for upstream-update work: pushes to update/** branches, pull
  # requests whose head branch is under update/, and manual
  # workflow_dispatch runs (the escape hatch for an ad-hoc baseline).
  # On ordinary main pushes and ordinary PRs it is skipped, and a
  # skipped job does not fail the run.
  # Exception, stated plainly: in this job ONLY, Node is the
  # disposable test-harness runtime — ubuntu-latest preinstalls it;
  # this workflow never installs Node (no setup-node). Product
  # runtime, install, build and typecheck remain Bun-only.
  # Results + triage: port/TEST-SUITES.md.
  test-suites:
    name: test suites (Vitest on preinstalled Node — update baseline)
    # github.ref for pull_request is refs/pull/<n>/merge, so PRs are
    # matched on github.head_ref (the source branch name) instead.
    # github.head_ref is empty outside pull_request, and
    # startsWith('', ...) is false, so the push cases are unaffected.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/update/') ||
      startsWith(github.head_ref, 'update/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4


      - name: Assert preinstalled Node (never installed by this workflow)
        run: node --version

