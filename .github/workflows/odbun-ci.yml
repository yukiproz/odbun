              run_install_script "$(readlink -f "$link")"
            done
            exit 0
          fi

          echo "pm-shim: unsupported invocation: $*" >&2
          exit 2
          ODBUN_PM_SHIM_EOF
          chmod +x "$RUNNER_TEMP/pm-shim"

      - name: Filtered install (frozen lockfile)
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          bun install --ignore-scripts --frozen-lockfile \
            --filter open-design --filter @open-design/web --filter @open-design/release \
            --filter @open-design/contracts --filter @open-design/components \
            --filter @open-design/platform --filter @open-design/host \
            --filter @open-design/registry-protocol --filter @open-design/agui-adapter \
            --filter @open-design/plugin-runtime --filter @open-design/sidecar-proto \
            --filter @open-design/launcher-proto --filter @open-design/sidecar \
            --filter @open-design/diagnostics --filter @open-design/daemon

      - name: Closure build (postinstall + pm-shim)
        env:
          OPEN_DESIGN_POSTINSTALL_CONCURRENCY: "2"
          OPEN_DESIGN_POSTINSTALL_TARGETS: '["apps/daemon","packages/host","packages/components"]'
        run: |
          npm_execpath="$RUNNER_TEMP/pm-shim" bun scripts/postinstall.mjs build
          test -f apps/daemon/dist/cli.js

      - name: Boot daemon under Bun — health + projects must answer 200
        run: |
          export OD_DATA_DIR="$RUNNER_TEMP/odbun-smoke-data"
          mkdir -p "$OD_DATA_DIR"
          bun apps/daemon/dist/cli.js --no-open --port 17457 > "$RUNNER_TEMP/daemon.log" 2>&1 &
          DPID=$!
          trap 'kill $DPID 2>/dev/null || true' EXIT
          ok=""
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:17457/api/health || true)" = "200" ]; then
              ok=1
              echo "health 200 after ${i} poll(s)"
              break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "daemon never became healthy; log follows" >&2
            cat "$RUNNER_TEMP/daemon.log" >&2
            exit 1
          fi
          curl -sf http://127.0.0.1:17457/api/health
          echo
          pcode="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:17457/api/projects)"
          echo "GET /api/projects -> $pcode"
          [ "$pcode" = "200" ] || { echo "expected 200 from /api/projects" >&2; exit 1; }
          kill $DPID
          wait $DPID 2>/dev/null || true
          trap - EXIT


  # DUAL-TRACK TEST SUITES (Hadi decision, 2026-11-06 — "yang penting
  # tes bisa jalan"). Exception, stated plainly: in this job ONLY,
  # Node is the disposable test-harness runtime — ubuntu-latest
  # preinstalls it; this workflow never installs Node (no setup-node).
  # The suites were written for Node+Vitest, so a failure here is the
  # cleanest signal about OUR PORT, free of runtime-interop noise.
  # Product runtime, install, build and typecheck remain Bun-only.
  # Exit condition: when the Bun track (test-suites-bun below) is
  # fully green, this Node track retires and Bun becomes the gate.
  # Results + triage: port/TEST-SUITES.md.
  test-suites:
    name: test suites (Vitest on preinstalled Node — gate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
