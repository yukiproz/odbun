              echo "pm-shim: no lifecycle scripts in $pkgdir — nothing to rebuild" >&2
            fi
            return 0
          }

          if [ "${1:-}" = "-C" ] && [ $# -ge 4 ] && [ "${3:-}" = "run" ]; then
